name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No Windows: the runtime underneath has io_uring and kqueue
          # backends and no IOCP one, so it does not compile there.
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest,    node_arch: x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, node_arch: arm64 }
          # Both Mac targets on Apple Silicon runners. macos-13 (Intel) runners
          # are scarce and being retired — a sibling project's release once sat
          # queued 11 minutes for one while every other target finished inside a
          # minute. Rosetta runs the x86_64 self-test, so it stays tested.
          # x64 Node under Rosetta, because an arm64 Node process cannot load
          # an x86_64 addon at all — the self-test needs a matching runtime,
          # not just a matching compiler target.
          - { target: x86_64-apple-darwin,       os: macos-latest,     node_arch: x64 }
          - { target: aarch64-apple-darwin,      os: macos-latest,     node_arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: ${{ matrix.node_arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci

      - run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Self-test
        # The binding's own protocol suite: text, binary, 128 KiB in one frame,
        # 128 KiB fragmented, ping/pong, close, and the backpressure bound.
        # Runs natively, or under Rosetta for x86_64 macOS.
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

      # The loader and the .d.ts are generated by `napi build` and are identical
      # for every target, but they are gitignored build artifacts — so without
      # this the publish job has no index.js to ship and the published package
      # cannot be required at all. Take them from one target only.
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: loader
          path: |
            index.js
            index.d.ts
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  publish:
    # Tag-driven, exactly like the runtime's release pipeline: nothing is
    # published unless a v* tag is pushed and every platform built and passed.
    needs: [build, lint]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm ci

      - name: Tag must match package.json
        # A tag that disagrees with the manifest publishes a version whose
        # binaries claim to be something else. Cheaper to fail here.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }

      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Restore the generated loader
        run: |
          cp artifacts/loader/index.js artifacts/loader/index.d.ts .
          test -s index.js || { echo "::error::index.js missing or empty"; exit 1; }

      - name: Assemble platform packages
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts
          ls -la npm/*/

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN not set — skipping publish"
            exit 0
          fi
          # Platform packages first: the root declares them as optional
          # dependencies, so publishing the root first would briefly point at
          # versions that do not exist yet. No `|| true` anywhere here — a
          # publish that half-fails should stop, not leave npm inconsistent.
          # Platform packages first, then the root, so the root's optional
          # dependencies never point at versions that do not exist yet.
          for dir in npm/*/; do
            (cd "$dir" && npm publish --access public)
          done

          # Injects optionalDependencies into the root package.json. Without it
          # npm installs the root alone, the loader finds no binding, and
          # require() throws — which is exactly how 0.1.2 shipped.
          npx napi pre-publish -t npm --skip-optional-publish

          # Two things 0.1.1 and 0.1.2 each taught us, checked before going out:
          # the tarball must contain the loader, and the manifest must point at
          # the platform packages.
          npm pack --silent >/dev/null
          tar tzf ramjet-ws-*.tgz | grep -q 'package/index.js' \
            || { echo "::error::index.js is not in the tarball"; exit 1; }
          rm -f ramjet-ws-*.tgz
          node -e '
            const o = require("./package.json").optionalDependencies || {};
            const n = Object.keys(o).length;
            if (n === 0) { console.error("::error::root package has no optionalDependencies — the binding would not install"); process.exit(1) }
            console.log("optionalDependencies:", n, Object.keys(o).join(" "));
          '

          npm publish --access public

      - name: GitHub release with the raw binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts && tar czf ../ramjet-ws-${GITHUB_REF_NAME}-binaries.tar.gz . && cd ..
          gh release create "${GITHUB_REF_NAME}" \
            ramjet-ws-${GITHUB_REF_NAME}-binaries.tar.gz \
            --title "ramjet-ws ${GITHUB_REF_NAME}" \
            --notes "\`npm install ramjet-ws\` — prebuilt for Linux and macOS on x64 and arm64.

          Built on the [ramjet](https://github.com/sofelia-ai/ramjet) runtime." \
            --verify-tag
